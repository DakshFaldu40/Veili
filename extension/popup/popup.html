<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Privacy Browser Agent</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot"></span>
        <h1>Privacy Browser Agent</h1>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <section class="status">
      <div><span class="muted">Privacy Status</span><div class="ok">🔒 Protected</div></div>
      <div><span class="muted">Current Page</span><div id="host">—</div></div>
    </section>

    <section class="card">
      <div class="card-title">Detected PII <span class="badge">🟢 LOCAL</span></div>
      <ul id="detected" class="list"><li class="muted">Scanning…</li></ul>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tab active" data-tab="raw">RAW</button>
        <button class="tab" data-tab="red">REDACTED</button>
      </div>
      <div id="banner" class="banner danger">RAW • PII EXPOSED</div>
      <pre id="preview" class="preview"></pre>
    </section>

    <section class="card">
      <input id="task" placeholder="Task e.g. Submit this form." value="Submit this form." />
      <div class="row">
        <button id="rescan" class="btn ghost">↻ Rescan</button>
        <button id="ask" class="btn primary">▶ Ask Agent</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Pipeline</div>
      <ol id="steps" class="steps"></ol>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
